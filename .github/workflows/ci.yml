name: CI

on:
  push:
    branches: [main]
  pull_request:
  # M12 §2.5 asks for the SBOM and the licence report "per release". Without this
  # trigger that would mean "per push to main, and somebody goes and finds the artifact
  # from the right run" — which is the version of the promise that quietly is not kept.
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # uops-store-pg's queries are checked against the schema at COMPILE time. Offline
  # mode uses the checked-in .sqlx/ metadata so that every job — and every clone —
  # builds without a database. The integration job turns this off and checks the
  # metadata against a real server.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: fmt · clippy · doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # --all-targets compiles every test as well, so a test that no longer builds
      # still fails here even though none of them run in this job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace test suite deliberately does NOT run here. Much of it needs
      # PostgreSQL and ClickHouse, and a job without them fails on the integration
      # targets rather than skipping them — this project does not keep tests that
      # quietly pass when the thing they test is absent. The suite runs once, in
      # `integration`, which has both engines.
      #
      # Doctests do run here: they include the `compile_fail` ones that enforce the
      # security invariants — Secret<T> is not Display/Serialize/Clone, TenantScope is
      # not Display/Default — and none of them touch a database.
      - name: Doctests
        run: cargo test --workspace --doc

      # Guards the bus conformance suite from going vacuous. It is the executable form
      # of the TelemetryBus contract, and the whole NATS migration rests on it still
      # meaning something a year from now. Removing backpressure — the behaviour
      # PLAN 0 change #4 chose deliberately — must fail it.
      - name: The bus conformance suite fails when backpressure is removed
        run: |
          F=crates/uops-bus/src/inprocess.rs
          cp "$F" "$RUNNER_TEMP/inprocess.bak"
          sed -i 's/if sender.send(delivery).await.is_err()/if sender.try_send(delivery).is_err()/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-bus --test conformance_inprocess > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/inprocess.bak" "$F"
            echo "::error::conformance passed with backpressure removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/inprocess.bak" "$F"
          echo "ok: dropping instead of blocking fails the suite"

  secrets-hygiene:
    name: no credential material in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SPEC M0.4: Secret<T> cannot be Display or Serialize, so the remaining way to
      # leak material is to call .expose() inside a formatting or logging macro. That
      # is a deliberate act and therefore greppable.
      #
      # Comment lines are dropped, for the same reason as the crypto guard below: prose
      # about the rule is not a violation of it, and a guard that also forbids writing
      # down the reasoning teaches people to delete the reasoning.
      #
      # `credential-print:` exempts one line. The first-run administrator password is
      # printed on a terminal on purpose — that is the whole design, see
      # uops-server/src/firstrun.rs — and there is no way to write it that a grep for
      # "secret reaching a macro" would not find. The exemption is a marker on the line
      # itself rather than in the comment above it, so it cannot be borrowed by the next
      # line down; and the count is asserted below, so adding a second one is a change
      # someone has to make deliberately and defend in review.
      - name: No .expose() inside logging or formatting macros
        run: |
          MACROS='(println!|eprintln!|format!|write!|writeln!|trace!|debug!|info!|warn!|error!|json!)[^;]*\.expose\(\)'
          code=$(grep -rnE "$MACROS" --include='*.rs' crates/ \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)

          hits=$(printf '%s' "$code" | grep -v 'credential-print:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::credential material reachable from a logging or formatting macro"
            exit 1
          fi

          exempt=$(printf '%s' "$code" | grep -c 'credential-print:' || true)
          if [ "$exempt" -ne 1 ]; then
            printf '%s\n' "$code"
            echo "::error::expected exactly 1 credential-print exemption, found $exempt"
            exit 1
          fi
          echo "ok: 1 deliberate credential print, 0 accidental"

      # The AeadProvider trait is the only sanctioned path to crypto primitives.
      #
      # The second grep drops comment lines. Naming Argon2 in prose is how the login
      # handler explains why it verifies a decoy hash for a user that does not exist —
      # the guard is against *calling* the primitive, and a guard that also forbids
      # writing down the reasoning teaches people to delete the reasoning.
      - name: No direct AEAD or KDF use outside uops-secrets
        run: |
          hits=$(grep -rnE '\b(Aes256Gcm|ChaCha20Poly1305|Argon2|aws_lc_rs)\b' \
                   --include='*.rs' crates/ --exclude-dir=uops-secrets \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::crypto primitive used outside uops-secrets; go through AeadProvider"
            exit 1
          fi
          echo "ok"

      # The whole of the RUSTSEC-2023-0071 ignore in deny.toml rests on one claim: this
      # product never performs an RSA private-key operation. That claim is true today and
      # is one `use` away from being false, so it is checked rather than trusted.
      #
      # The names below are the crate's private-key surface. A signing key, a decryption
      # key, or key generation appearing anywhere means the advisory now applies and the
      # ignore has to go.
      - name: RSA is verification only
        run: |
          PRIVATE='RsaPrivateKey|SigningKey|DecryptingKey|to_pkcs8|from_pkcs8'
          hits=$(grep -rnE "\b($PRIVATE)\b" --include='*.rs' crates/uops-oidc/ | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::an RSA private-key operation appeared; RUSTSEC-2023-0071 now applies and the deny.toml ignore must be removed"
            exit 1
          fi
          echo "ok: public-key verification only"

      # M10 §2.4's last paragraph, and the acceptance criterion that names this job: "a
      # rendered command and a captured output never reach a log line — by the same kind of
      # CI grep that keeps crypto in uops-secrets".
      #
      # A run's transcript is redacted and access-controlled. A log line is neither: it
      # goes to stdout, into a container platform's log aggregator, and out to whoever can
      # read that — which is very often not the people who may read a runbook run.
      #
      # `format!` is deliberately not in the list. Building the run's own `failure` string
      # out of what a device said is allowed and necessary; what is forbidden is *printing*
      # it. The comment-line filter is the crypto guard's, for the crypto guard's reason:
      # a rule that also forbids writing down the reasoning teaches people to delete the
      # reasoning.
      - name: A rendered command and a captured output never reach a log line
        run: |
          LOGGERS='(println!|eprintln!|dbg!|trace!|debug!|info!|warn!|error!)'
          SENSITIVE='(rendered|transcript|\.output|outcome\.output|says)'
          hits=$(grep -rnE "$LOGGERS[^;]*$SENSITIVE" --include='*.rs' \
                   crates/uops-runner/src crates/uops-store-pg/src/runbooks.rs \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a rendered command or captured output reached a log line; it belongs in the run transcript, which is redacted and access-controlled"
            exit 1
          fi
          echo "ok: transcripts stay in the transcript"

  integration:
    name: schemas · repositories · api
    runs-on: ubuntu-latest

    # Both engines in one job, because the things under test span them: POST /query
    # resolves a selector against PostgreSQL and answers it from ClickHouse. Split
    # across two jobs, every test that crosses that seam has no home — which is the
    # mistake this file previously made.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uops
          POSTGRES_PASSWORD: uops
          POSTGRES_DB: uops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uops -d uops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        # Pinned to the version W1 was measured on. The text index reached GA in 26.x
        # and its function names moved during the beta — see the searchAll() note in
        # uops-query's compile.rs.
        image: clickhouse/clickhouse-server:26.8-alpine
        env:
          CLICKHOUSE_DB: uops
          CLICKHOUSE_USER: uops
          CLICKHOUSE_PASSWORD: uops
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user uops --password uops --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://uops:uops@localhost:5432/uops
      PGPASSWORD: uops
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      # This job has servers, so queries are verified against them rather than against
      # the recorded metadata.
      SQLX_OFFLINE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ---- PostgreSQL -------------------------------------------------------------

      # The same tool deployments use. Applying with psql would leave _sqlx_migrations
      # empty, so CI would not be exercising the real upgrade path.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Apply PostgreSQL migrations
        run: sqlx migrate run

      # Re-running must apply nothing. If the migration state were not recorded, this
      # second run would fail on "type already exists" — and an on-premise customer
      # upgrading unattended would hit that instead of CI.
      - name: Re-running PostgreSQL migrations applies nothing
        run: sqlx migrate run

      - name: Schema invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/invariants.sql

      # The recorded query metadata must match the queries in the tree, or an offline
      # build verifies something that is no longer there.
      - name: Query metadata is current
        run: |
          cargo sqlx prepare --workspace --check -- --all-targets || {
            echo "::error::.sqlx is stale — run: cargo sqlx prepare --workspace -- --all-targets"
            exit 1
          }

      # ---- ClickHouse -------------------------------------------------------------

      - name: Apply ClickHouse migrations
        run: bash scripts/ch.sh apply

      - name: Re-running ClickHouse migrations applies nothing
        run: |
          OUT="$(bash scripts/ch.sh apply)"
          echo "$OUT"
          echo "$OUT" | grep -q "schema is up to date" || {
            echo "::error::the runner did not recognise an up-to-date schema"
            exit 1
          }

      # The check nothing else performs: uops-query's golden SQL against the schema
      # ch-migrations actually creates. Unit tests on both sides pass while they drift,
      # which is how searchAll() — a function that does not exist — survived for weeks.
      - name: Query codegen matches the schema
        run: bash scripts/ch.sh verify

      # Materialised views, materialised columns and the text index, asserted on real
      # rows rather than on the DDL text.
      - name: Schema behaviour
        run: bash scripts/ch.sh smoke

      # ---- Everything -------------------------------------------------------------

      # SPEC §M2: "SNMPv3 authPriv (SHA-256 / AES-256) against a real device". The
      # simulator proves every failure mode and cannot prove this one — it is the same
      # code on both ends. net-snmp is a different implementation of USM, so the key
      # derivation, the privacy IV and the HMAC are all actually being checked.
      #
      # Without UOPS_SNMP_AGENT these tests skip and say so. Setting it here is what
      # makes them run, and a skip in this job would be a silent hole.
      - name: Start the SNMP agent fixture
        run: |
          docker compose -f deploy/docker-compose.yml --profile test up -d snmp-agent
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' uops-snmp-agent 2>/dev/null || echo starting)
            if [ "$state" = "healthy" ]; then
              echo "agent healthy after ${i}s"
              break
            fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.yml --profile test logs snmp-agent | tail -5

      - name: SNMPv3 authPriv against a real agent
        env:
          UOPS_SNMP_AGENT: 127.0.0.1:16100
        run: |
          output=$(cargo test -p uops-snmp --test agent -- --nocapture 2>&1)
          echo "$output"
          # A skipped test passes. If the fixture were unreachable the suite would be
          # green and prove nothing, so the skip message is itself a failure here.
          if echo "$output" | grep -q "SKIPPED"; then
            echo "::error::the agent tests skipped; the fixture was not reachable"
            exit 1
          fi

      # The availability check uses an unprivileged ICMP datagram socket rather than a
      # raw one, so it needs no CAP_NET_RAW — but it does need this sysctl to include the
      # running process's group. A container on Docker's default bridge gets it for free;
      # a VM runner does not, so it is set here explicitly. This line is also the
      # deployment requirement, stated where it cannot drift from the code.
      - name: Allow unprivileged ICMP
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          cat /proc/sys/net/ipv4/ping_group_range

      # The binary's own end-to-end: a device in PostgreSQL, polled over real SNMP,
      # becoming rows in ClickHouse. Every other test in uops-poller replaces one end or
      # the other; this is the only one with nothing simulated in it, which is where the
      # failures in the joins live.
      - name: A device in PostgreSQL becomes rows in ClickHouse
        env:
          UOPS_SNMP_AGENT: 127.0.0.1:16100
        run: |
          output=$(cargo test -p uops-poller --test live -- --test-threads=1 --nocapture 2>&1)
          echo "$output"
          # Same reasoning as the agent tests above: a skipped test is a green suite that
          # proves nothing, so the skip message is itself a failure here.
          if echo "$output" | grep -q "SKIPPED:"; then
            echo "::error::the live poller test skipped; the fixture or unprivileged ICMP was unavailable"
            exit 1
          fi

      # M12 §3's lease criterion, measured rather than argued: two pollers against one
      # database write the samples of one. It prints the two counts, and the numbers are
      # echoed here so a regression is visible in the log rather than only in an assertion
      # — a run that suddenly reports 10 and 10 has a story worth reading.
      #
      # Needs no SNMP fixture: the device is `uops_snmp::sim` and only the databases are
      # real. That is why it is its own step and not gated on the container — an
      # acceptance criterion that runs only where a particular container is up is one
      # that stops being run.
      - name: Two pollers write the samples of one
        run: |
          output=$(cargo test -p uops-poller --test lease -- --nocapture 2>&1)
          echo "$output"
          echo "$output" | grep "M12 §3, measured" || {
            echo "::error::the lease measurement printed no numbers; it did not run"
            exit 1
          }

      # The whole suite, in the one job that has what it needs. Unit and integration
      # together: which is which is not a distinction worth maintaining in a list
      # somebody has to remember to update.
      - name: Workspace tests
        run: cargo test --workspace --all-targets

      # ---- Guards on the tests themselves -----------------------------------------
      #
      # Each of these breaks something on purpose and requires the suite to FAIL. A
      # test that passes whether or not the property holds is worse than no test,
      # because it reads as covered — and this repository has been caught by that
      # twice: the compile_fail doctests in uops-core, and a login-timing assertion
      # that measured everything except the thing it was protecting.

      # M12 §2.2. The audience check is the one people leave out, and the one that
      # matters most in a large organisation: every application behind the same Entra ID
      # tenant is signed by the same key, so without it a token minted for the cafeteria
      # booking system is a correctly signed, unexpired, right-issuer login here.
      #
      # The mutation leaves every other check in place, so the suite must fail on exactly
      # the test that names this.
      - name: The SSO tests fail when the audience check is removed
        run: |
          F=crates/uops-oidc/src/token.rs
          cp "$F" "$RUNNER_TEMP/token.bak"
          sed -i 's/^        if !values.iter().any(|a| a == expected.client_id) {$/        if false {/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test sso > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/token.bak" "$F"
            echo "::error::the SSO tests passed with the audience check removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/token.bak" "$F"
          echo "ok: a token minted for another application fails the suite"

      # The other half of §2.2: an organization that requires SSO refuses password login
      # for everyone except its named break-glass account. The mutation makes the policy
      # permit everybody, which is exactly what the setting is for and looks like nothing
      # in a diff of one line.
      - name: The SSO tests fail when requiring SSO stops refusing passwords
        run: |
          F=crates/uops-api/src/routes/auth.rs
          cp "$F" "$RUNNER_TEMP/auth.bak"
          sed -i 's/^    if !policy.allows_password() {$/    if false {/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test sso > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/auth.bak" "$F"
            echo "::error::the SSO tests passed with password login allowed where SSO is required"
            exit 1
          fi
          cp "$RUNNER_TEMP/auth.bak" "$F"
          echo "ok: a password accepted where SSO is required fails the suite"

      - name: The schema invariants fail when an invariant is removed
        run: |
          DROP="ALTER TABLE resource DROP CONSTRAINT resource_parent_id_tenant_id_fkey;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$DROP"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/invariants.sql > /dev/null 2>&1; then
            echo "::error::the schema invariant suite passed with tenant isolation removed"
            exit 1
          fi
          echo "ok: removing the constraint fails the suite"

      # Two replicas of the server starting in the same second both see an empty
      # app_user. Without the advisory lock both bootstrap, and the operator is shown
      # two passwords, one of which belongs to an account they will never find again.
      # Nothing about the code looks wrong when this breaks: a shared lock is still a
      # lock, and still spelled like one.
      - name: The bootstrap tests fail when the advisory lock stops excluding
        run: |
          F=crates/uops-store-pg/src/bootstrap.rs
          cp "$F" "$RUNNER_TEMP/bootstrap.bak"
          sed -i 's/pg_advisory_xact_lock(/pg_advisory_xact_lock_shared(/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test bootstrap > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/bootstrap.bak" "$F"
            echo "::error::the bootstrap tests passed with a lock that excludes nobody"
            exit 1
          fi
          cp "$RUNNER_TEMP/bootstrap.bak" "$F"
          echo "ok: a shared bootstrap lock fails the suite"

      # The single most user-visible way this product can fail on day one: the password
      # on the terminal is not the password in the database. Nothing crashes, nothing
      # logs, and the installation simply cannot be entered. The mutation stores a hash
      # of a second generated password — still a real Argon2 hash of a real password,
      # so nothing downstream looks wrong.
      - name: The boot test fails when the announced password is not the stored one
        run: |
          F=crates/uops-server/src/firstrun.rs
          cp "$F" "$RUNNER_TEMP/firstrun.bak"
          sed -i 's/^    let hash = password::hash(&plaintext)?;$/    let hash = password::hash(\&generate::password()?)?;/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-server --test boot > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/firstrun.bak" "$F"
            echo "::error::the boot tests passed with a password nobody could log in with"
            exit 1
          fi
          cp "$RUNNER_TEMP/firstrun.bak" "$F"
          echo "ok: announcing the wrong password fails the suite"

      # SPEC §M1's headline acceptance criterion, guarded.
      #
      # The mutation leaves `tenant_id = $2` in the SQL and makes it always true. That
      # matters: the source scanner in uops-store-pg::enforced greps for a tenant
      # predicate and still finds one, and the schema invariants still pass, because
      # neither of them executes anything. Verified — both are green under this
      # mutation. The isolation test is the only thing in the repository that catches
      # it, which is the argument for the test existing.
      - name: The isolation tests fail when a tenant predicate stops filtering
        run: |
          F=crates/uops-store-pg/src/resource.rs
          cp "$F" "$RUNNER_TEMP/resource.bak"
          sed -i 's/WHERE id = \$1 AND tenant_id = \$2/WHERE id = $1 AND (tenant_id = $2 OR TRUE)/g' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test isolation > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/resource.bak" "$F"
            echo "::error::the isolation tests passed with a tenant predicate that matches every row"
            exit 1
          fi
          cp "$RUNNER_TEMP/resource.bak" "$F"
          echo "ok: a tenant predicate that filters nothing fails the suite"

      # And the coverage half of it: a route added without an isolation case must fail
      # before any request is sent. Without this, "every endpoint" decays to "every
      # endpoint that existed when someone last thought about it".
      - name: The isolation tests fail when a route has no case
        run: |
          F=crates/uops-api/src/routes/mod.rs
          cp "$F" "$RUNNER_TEMP/routes.bak"
          sed -i 's|\.route("/api/v1/query", post(query::run))|.route("/api/v1/query", post(query::run))\n        .route("/api/v1/mutation-guard", get(auth::me))|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test isolation > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/routes.bak" "$F"
            echo "::error::the isolation tests passed with an uncovered route"
            exit 1
          fi
          cp "$RUNNER_TEMP/routes.bak" "$F"
          echo "ok: an uncovered route fails the suite"

      # The bug this scenario found, restored. An operator merges a review case away;
      # the review row names the provisional and the merge decision names the survivor,
      # so nothing in identity_decision ever answers it and the queue offers the same
      # question forever.
      #
      # Measured under this mutation: uops-identity passes, the PgIdentityStore suite
      # passes, the schema invariants pass. Only the end-to-end scenario notices, which
      # is the argument for running the SPEC sentence as one sequence rather than as
      # four independent tests.
      - name: The identity scenario fails when a merged review never leaves the queue
        run: |
          F=crates/uops-store-pg/src/identity.rs
          cp "$F" "$RUNNER_TEMP/identity.bak"
          sed -i 's/AND a.historical_id = d.resource_id)/AND a.historical_id = d.resource_id AND false)/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test identity_scenario > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/identity.bak" "$F"
            echo "::error::the scenario passed with a review queue that never clears"
            exit 1
          fi
          cp "$RUNNER_TEMP/identity.bak" "$F"
          echo "ok: a review that outlives its own answer fails the suite"

      # SPEC makes decommissioning a soft delete so history still resolves. A map that
      # counted retired equipment would be showing an estate the customer no longer has,
      # and the count on a pin is what an operator sizes a problem by.
      - name: The site tests fail when the map counts decommissioned resources
        run: |
          F=crates/uops-store-pg/src/sites.rs
          cp "$F" "$RUNNER_TEMP/sites.bak"
          sed -i "s/AND r.status <> 'decommissioned'//" "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if SQLX_OFFLINE=false cargo test -p uops-store-pg --test sites > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/sites.bak" "$F"
            echo "::error::the map counted retired equipment as part of the estate"
            exit 1
          fi
          cp "$RUNNER_TEMP/sites.bak" "$F"
          echo "ok: counting decommissioned resources fails the suite"

      # A vendor read off a MAC is an inference; a vendor the device reported is a
      # statement, and so is one an operator typed. The `vendor IS NULL` predicate is
      # what keeps the guess from overwriting either, in the statement rather than in a
      # check somewhere above it.
      - name: The discovery tests fail when a guessed vendor overwrites a known one
        run: |
          F=crates/uops-store-pg/src/discovery.rs
          cp "$F" "$RUNNER_TEMP/discovery.bak"
          sed -i 's|WHERE tenant_id = $1 AND id = $2 AND vendor IS NULL|WHERE tenant_id = $1 AND id = $2|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test discovery > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/discovery.bak" "$F"
            echo "::error::a vendor inferred from a MAC overwrote what the device said about itself"
            exit 1
          fi
          cp "$RUNNER_TEMP/discovery.bak" "$F"
          echo "ok: an inference overwriting a statement fails the suite"

      # The availability check sends a real ICMP echo request. A wrong packet is silent:
      # the kernel sends it, nothing replies, and every device in the fleet reports down
      # for ever. Type 13 is a timestamp request — well-formed, and not what an echo
      # reply answers.
      - name: The check tests fail when the ICMP packet is not an echo request
        run: |
          F=crates/uops-poller/src/check.rs
          cp "$F" "$RUNNER_TEMP/check.bak"
          sed -i 's|if v6 { 128 } else { 8 }, // type|if v6 { 128 } else { 13 }, // type|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-poller --lib check > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/check.bak" "$F"
            echo "::error::the check tests passed with a packet no device answers"
            exit 1
          fi
          cp "$RUNNER_TEMP/check.bak" "$F"
          echo "ok: a malformed echo request fails the suite"

      # SPEC §M2: "a 32-bit counter wrap produces no negative rate in any query".
      #
      # The mutation is the repair everybody proposes: assume the counter went round
      # exactly once and add the modulus back. It is right exactly once, and on a
      # 10 Gbps link a 32-bit byte counter wraps seventeen times a minute — so it
      # reports a seventeenth of the traffic, confidently, with nothing to indicate it
      # guessed.
      - name: The counter tests fail when a wrap is silently repaired
        run: |
          F=crates/uops-poll/src/counter.rs
          cp "$F" "$RUNNER_TEMP/counter.bak"
          sed -i 's|^    Delta::Wrapped$|    rate(width.modulus() - u128::from(previous.value) + u128::from(current.value), elapsed_nanos)|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-poll counter > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/counter.bak" "$F"
            echo "::error::the counter tests passed with a wrap repaired by guesswork"
            exit 1
          fi
          cp "$RUNNER_TEMP/counter.bak" "$F"
          echo "ok: guessing at a wrap fails the suite"

      # The bug the wheel tests found while being written. Jitter is applied after the
      # interval is checked against the wheel's span, so a legal interval can be pushed
      # past it — and an offset larger than the wheel lands at `offset - slots` ticks
      # ahead. A 10-tick interval jittered to 11 on a 10-slot wheel fires one tick later
      # instead of eleven, forever, and nothing about the code looks wrong.
      - name: The wheel tests fail when a jittered offset can wrap the wheel
        run: |
          F=crates/uops-poll/src/wheel.rs
          cp "$F" "$RUNNER_TEMP/wheel.bak"
          sed -i 's/jittered.clamp(1, self.slots.len() as u64)/jittered.max(1)/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-poll wheel > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/wheel.bak" "$F"
            echo "::error::the wheel tests passed with a schedule that can fire early"
            exit 1
          fi
          cp "$RUNNER_TEMP/wheel.bak" "$F"
          echo "ok: an offset that outruns the wheel fails the suite"

      # A walk that does not stop at its table boundary keeps going into the rest of the
      # agent — ifTable, then ifXTable, then ipAddrTable, then everything. A three-request
      # poll becomes a several-thousand-request one, on every device, every interval. On a
      # fleet that is a denial of service you wrote yourself, and the only symptom is that
      # polling is slow.
      #
      # The stop is Oid::starts_with, arc-wise. This guard is also what catches it being
      # rewritten as a string comparison, which is correct for almost every prefix and
      # wrong for 1.3.6.1.2.1.2.2.10 against 1.3.6.1.2.1.2.2.1.
      - name: The walk tests fail when a table boundary stops being one
        run: |
          F=crates/uops-snmp/src/walk.rs
          cp "$F" "$RUNNER_TEMP/walk.bak"
          sed -i 's|if !vb.oid.starts_with(table) {|if false \&\& !vb.oid.starts_with(table) {|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-snmp --test walk > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/walk.bak" "$F"
            echo "::error::the walk tests passed with a walk that runs past its table"
            exit 1
          fi
          cp "$RUNNER_TEMP/walk.bak" "$F"
          echo "ok: a walk that does not stop fails the suite"

      # A syslog message carries no tenant, so the daemon takes it from the listener the
      # message arrived on. If that attribution collapses -- every listener resolving to
      # the same tenant -- one customer's logs land in another customer's account, which
      # is the worst failure this product has and produces no error anywhere.
      #
      # The mutation is the shape of the real mistake: a loop that computes the right
      # tenant and then stores the wrong one.
      - name: The syslog daemon's tests fail when every listener resolves to one tenant
        run: |
          F=crates/uops-collector-syslog/src/run.rs
          cp "$F" "$RUNNER_TEMP/syslogd.bak"
          # '#' as the delimiter: the replacement contains a closure, and '|' is both
          # sed's delimiter and Rust's closure syntax.
          sed -i 's#^            tenant_id,$#            tenant_id: bound.first().map_or(tenant_id, |b: \&Bound| b.tenant_id),#' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-collector-syslog --test live > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/syslogd.bak" "$F"
            echo "::error::the live tests passed with every listener attributed to one tenant"
            exit 1
          fi
          cp "$RUNNER_TEMP/syslogd.bak" "$F"
          echo "ok: collapsing tenant attribution fails the suite"

      # SPEC §M2: "dead device does not delay polling of healthy devices (measured, not
      # assumed)". The mutation serialises the fleet — one poll in flight, whatever the
      # limit says — which is precisely the failure the criterion is about.
      #
      # This guard exists because the first version of the measurement did NOT catch it.
      # Completed::elapsed started after acquiring a slot, so queue time was invisible
      # and a strictly serialised fleet reported the same numbers as a concurrent one.
      # It measures total() now, and the mutation produces 4.07s against 5.5ms.
      - name: The fleet tests fail when the poller is serialised
        run: |
          F=crates/uops-poll/src/executor.rs
          cp "$F" "$RUNNER_TEMP/executor.bak"
          sed -i 's|Arc::new(Semaphore::new(limits.global))|Arc::new(Semaphore::new(1))|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-poll --test fleet > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/executor.bak" "$F"
            echo "::error::the fleet tests passed with every device polled one at a time"
            exit 1
          fi
          cp "$RUNNER_TEMP/executor.bak" "$F"
          echo "ok: a serialised fleet fails the suite"

      # SPEC §M2: "a 32-bit counter wrap produces no negative rate in any query". The
      # rule lives in uops_poll::counter and is well tested there, but nothing runs that
      # Rust on a query path — the rate is computed in ClickHouse. Without the
      # forwards-only guard the wrap fixture reports -71 582 754 B/s, which is what an
      # operator would see on a graph.
      - name: The telemetry tests fail when a wrap can produce a negative rate
        run: |
          F=crates/uops-query/src/compile.rs
          cp "$F" "$RUNNER_TEMP/compile.bak"
          sed -i 's|if(rn > 1 AND observed_at > prev_at AND value >= prev_value, |if(rn > 1 AND observed_at > prev_at, |' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-ch --test telemetry > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/compile.bak" "$F"
            echo "::error::the telemetry tests passed with a counter wrap producing a negative rate"
            exit 1
          fi
          cp "$RUNNER_TEMP/compile.bak" "$F"
          echo "ok: a negative rate fails the suite"

      # A series is one resource's one metric with one set of labels. Partition by less
      # and two interfaces' counters are differenced against each other — which produces
      # a number rather than an error, and a plausible-looking one.
      - name: The telemetry tests fail when two interfaces share a series
        run: |
          F=crates/uops-query/src/compile.rs
          cp "$F" "$RUNNER_TEMP/compile.bak"
          sed -i 's|PARTITION BY resource_id, metric, labels |PARTITION BY resource_id, metric |' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-ch --test telemetry > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/compile.bak" "$F"
            echo "::error::the telemetry tests passed with two interfaces in one series"
            exit 1
          fi
          cp "$RUNNER_TEMP/compile.bak" "$F"
          echo "ok: mixing two interfaces' counters fails the suite"

      # SPEC §M2 asks for child resources **and** member_of relationships. A child with
      # no edge is a resource unreachable from the device it belongs to — which the
      # topology UI renders as a switch with no ports, and which no test that only
      # counted children would notice.
      - name: The discovery tests fail when the edge is not a member_of
        run: |
          F=crates/uops-store-pg/src/discovery.rs
          cp "$F" "$RUNNER_TEMP/discovery.bak"
          sed -i "s|'member_of', 1.0|'hosts', 1.0|" "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test discovery > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/discovery.bak" "$F"
            echo "::error::the discovery tests passed with children that are not members of anything"
            exit 1
          fi
          cp "$RUNNER_TEMP/discovery.bak" "$F"
          echo "ok: a child with no member_of edge fails the suite"

      # Discovery runs every fifteen minutes for the life of a device. Without a key to
      # match an already-discovered interface on, a 48-port switch accumulates 4 608
      # interfaces a day, each holding a fraction of the telemetry.
      - name: The discovery tests fail when rediscovery stops matching
        run: |
          F=crates/uops-store-pg/src/discovery.rs
          cp "$F" "$RUNNER_TEMP/discovery.bak"
          sed -i 's|ON CONFLICT (tenant_id, parent_id, kind, name) WHERE parent_id IS NOT NULL|ON CONFLICT (id)|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test discovery > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/discovery.bak" "$F"
            echo "::error::the discovery tests passed with a key that never matches an existing child"
            exit 1
          fi
          cp "$RUNNER_TEMP/discovery.bak" "$F"
          echo "ok: rediscovery that duplicates fails the suite"

      # A KEK rotation computes a new wrapping from a DEK it read. If the credential is
      # rotated in between — `put` reuses the id, so the row gets a new DEK and a new
      # ciphertext — writing that wrapping back leaves the row wrapping the old DEK over
      # the new ciphertext. Unwrapping then yields a key that decrypts nothing and the
      # credential is permanently gone, with no error until somebody tries to use it.
      # The compare-and-set in the WHERE clause is the whole of the fix.
      - name: The sealed-credential tests fail when the re-wrap stops being conditional
        run: |
          F=crates/uops-store-pg/src/sealed.rs
          cp "$F" "$RUNNER_TEMP/sealed.bak"
          sed -i 's|WHERE id = $1 AND wrapped_dek = $5|WHERE id = $1|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test sealed > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/sealed.bak" "$F"
            echo "::error::the sealed tests passed with a re-wrap that overwrites a newer DEK"
            exit 1
          fi
          cp "$RUNNER_TEMP/sealed.bak" "$F"
          echo "ok: an unconditional re-wrap fails the suite"

      # `resource` has no address column: an address is an identifier, so the poller
      # reaches a device through the same `mgmt_ip` row identity resolution wrote. Join
      # the wrong kind and the fleet is empty — and an empty fleet polls nothing, fails
      # nothing, and reports success.
      - name: The live poller test fails when the device join loses its address
        env:
          UOPS_SNMP_AGENT: 127.0.0.1:16100
        run: |
          F=crates/uops-store-pg/src/pollable.rs
          cp "$F" "$RUNNER_TEMP/pollable.bak"
          sed -i "s/AND i.kind = 'mgmt_ip'/AND i.kind = 'hostname'/" "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if SQLX_OFFLINE=false cargo test -p uops-poller --test live > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/pollable.bak" "$F"
            echo "::error::the live test passed with a fleet that cannot contain any device"
            exit 1
          fi
          cp "$RUNNER_TEMP/pollable.bak" "$F"
          echo "ok: a fleet with no reachable devices fails the suite"

      # Discovery and the interface poll are separate jobs on separate intervals, and
      # the only thing carrying the names between them is the per-device memory. A
      # poller that discovered into a value it then dropped would write rows labelled by
      # index forever — which looks like working software until somebody opens a graph.
      - name: The poll tests fail when discovery forgets what it found
        run: |
          F=crates/uops-poller/src/poll.rs
          cp "$F" "$RUNNER_TEMP/poll.bak"
          sed -i 's|or_default().names = names;|or_default().names = InterfaceNames::new();|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-poller --test poll > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/poll.bak" "$F"
            echo "::error::the poll tests passed with discovery throwing away its result"
            exit 1
          fi
          cp "$RUNNER_TEMP/poll.bak" "$F"
          echo "ok: discovery that goes nowhere fails the suite"

      - name: The API isolation tests fail when the role check is removed
        run: |
          F=crates/uops-api/src/extract.rs
          cp "$F" "$RUNNER_TEMP/extract.bak"
          sed -i 's/\.ok_or(ApiError::NotFound)?;/.unwrap_or(Role::Viewer);/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test extractor > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/extract.bak" "$F"
            echo "::error::isolation tests passed with the role check removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/extract.bak" "$F"
          echo "ok: defaulting an absent role fails the suite"

      - name: The audit tests fail when the scope stops registering
        run: |
          F=crates/uops-api/src/extract.rs
          cp "$F" "$RUNNER_TEMP/extract-audit.bak"
          sed -i 's/^        recorder.set_context(tenant, scope.actor().as_audit_str());$//' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test resources > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/extract-audit.bak" "$F"
            echo "::error::the audit tests passed with the registration removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/extract-audit.bak" "$F"
          echo "ok: an unregistered scope fails the audit suite"

      # Login must cost the same whether or not the address exists. Short-circuiting
      # the absent-user path skips Argon2 and turns the response time into an
      # account-enumeration oracle.
      - name: The login timing test fails when the absent-user path short-circuits
        run: |
          F=crates/uops-api/src/routes/auth.rs
          cp "$F" "$RUNNER_TEMP/auth.bak"
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          marker = "    let found = state.store.user_credentials_by_email(email).await?;"
          assert marker in src, "the mutation target moved"
          src = src.replace(
              marker,
              marker + "\n    if found.is_none() {\n        return Err(ApiError::Unauthenticated);\n    }",
              1,
          )
          open(path, "w", encoding="utf-8").write(src)
          PY
          if cargo test -p uops-api --test auth_routes > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/auth.bak" "$F"
            echo "::error::the login timing test passed with the absent-user path short-circuited"
            exit 1
          fi
          cp "$RUNNER_TEMP/auth.bak" "$F"
          echo "ok: short-circuiting the absent-user path fails the suite"

      # Left last: it edits a migration file, and the runner must refuse to continue
      # afterwards, so nothing else in this job can run behind it.
      - name: An edited applied migration is refused
        run: |
          echo "-- appended by CI to simulate an edit" >> ch-migrations/0003_logs_counts_5m.sql
          if bash scripts/ch.sh apply; then
            echo "::error::the runner accepted an edited migration that was already applied"
            exit 1
          fi
          echo "ok: editing an applied migration stops the run"

      # ---- the restore drill, as a guard -------------------------------------------
      #
      # M12 §2.4 asks for a drill rather than a procedure, and `docs/restore-drill.md`
      # records why: the first one silently doubled every aggregate table. Restoring the
      # raw rows made each materialized view fire into an aggregate that already held the
      # rows from the backup, and *every raw table was exactly right* — which is what
      # somebody spot-checking a restore looks at.
      #
      # A drill performed once is a drill that was true once. This is it as a guard, so
      # the aggregate-doubling cannot come back, and so that a materialized view added in
      # a future migration is covered the day it is added rather than at the next
      # rehearsal.
      # `pg_dump` refuses to read a server newer than itself, and the runner image ships
      # a client one major behind the `postgres:17-alpine` service this job uses. Pinning
      # the service down to match would be the wrong fix: it would stop CI exercising the
      # version a deployment runs.
      - name: Install a matching PostgreSQL client
        run: |
          set -euo pipefail
          if pg_dump --version | grep -q " 17"; then
            echo "already 17"
            exit 0
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc             https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]             https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: A backup restores to exactly what was backed up
        run: |
          set -euo pipefail

          # Something to lose. The suite above has already populated both planes; this
          # adds a row to each aggregate's source so none of the interesting tables is
          # empty, because an empty table matches itself whatever the restore does.
          curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD&database=$CLICKHOUSE_DB" \
            --data-binary "SELECT count() FROM logs" > /dev/null

          bash scripts/backup.sh "$RUNNER_TEMP/drill"

          psql "$DATABASE_URL" -tAc "SELECT 1" > /dev/null
          createdb -h localhost -U uops uops_restored
          curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
            --data-binary "CREATE DATABASE uops_restored"

          RESTORE_DATABASE_URL="postgres://uops:uops@localhost:5432/uops_restored" \
          RESTORE_CLICKHOUSE_DB="uops_restored" \
            bash scripts/restore.sh "$RUNNER_TEMP/drill"

          # The comparison is the step that is not optional. The aggregate tables are the
          # ones that were wrong, and they are the ones nothing else in this file checks.
          failed=0
          for t in logs logs_counts_5m metrics metrics_5m metrics_1h events states \
                   flows flows_5m spans service_5m; do
            a=$(curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
                  --data-binary "SELECT count() FROM ${CLICKHOUSE_DB}.$t")
            b=$(curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
                  --data-binary "SELECT count() FROM uops_restored.$t")
            if [ "$a" != "$b" ]; then
              echo "::error::$t restored $b rows from a backup of $a"
              failed=1
            fi
          done

          for t in app_user tenant resource credential user_tenant_role alert_rule collector; do
            a=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM $t")
            b=$(psql "postgres://uops:uops@localhost:5432/uops_restored" -tAc "SELECT count(*) FROM $t")
            if [ "$a" != "$b" ]; then
              echo "::error::$t restored $b rows from a backup of $a"
              failed=1
            fi
          done

          [ "$failed" = 0 ] || exit 1
          echo "ok: every table restored to exactly what was backed up"

      # And the guard on the guard. Re-attaching the materialized views before the load
      # instead of after is the exact mistake the first drill made, and it must fail.
      - name: The restore drill fails when the aggregates are allowed to double
        run: |
          set -euo pipefail
          F=scripts/restore.sh
          cp "$F" "$RUNNER_TEMP/restore.bak"
          # Detach nothing: the views stay attached through the load, and every aggregate
          # is written twice — once from the backup and once by the view.
          sed -i 's/^      echo "DETACH TABLE ${view}" | ch_sql$/      true/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi

          dropdb -h localhost -U uops --if-exists uops_doubled
          createdb -h localhost -U uops uops_doubled
          curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
            --data-binary "DROP DATABASE IF EXISTS uops_doubled"
          curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
            --data-binary "CREATE DATABASE uops_doubled"

          RESTORE_DATABASE_URL="postgres://uops:uops@localhost:5432/uops_doubled" \
          RESTORE_CLICKHOUSE_DB="uops_doubled" \
            bash "$F" "$RUNNER_TEMP/drill" > /dev/null

          cp "$RUNNER_TEMP/restore.bak" "$F"

          a=$(curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
                --data-binary "SELECT count() FROM ${CLICKHOUSE_DB}.logs_counts_5m")
          b=$(curl -sS -f "$CLICKHOUSE_URL/?user=$CLICKHOUSE_USER&password=$CLICKHOUSE_PASSWORD" \
                --data-binary "SELECT count() FROM uops_doubled.logs_counts_5m")
          if [ "$a" = "$b" ]; then
            echo "::error::leaving the materialized views attached did not double logs_counts_5m ($a vs $b); the detach is no longer what prevents it"
            exit 1
          fi
          echo "ok: leaving the views attached doubles the aggregates ($a became $b), and the detach is what stops it"

  supply-chain:
    name: advisories · licenses · SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # PLAN 0b: supply-chain review is standard in government and enterprise
      # procurement. Producing this from the first release is cheap; retrofitting it
      # to a mature dependency tree is archaeology.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --all --format json

      # M12 §2.5: the evidence a buyer asks for is generated, not written once. cargo-deny
      # above *enforces* the licence policy and answers yes or no; this *reports* it, and
      # a procurement review needs the list rather than the verdict.
      #
      # Deliberately not the same job as the enforcement: a report that could fail the
      # build is a report somebody is tempted to trim.
      - name: Generate the dependency licence report
        run: |
          python3 scripts/licence-report.py > licences.md
          echo "--- summary ---"
          sed -n '/^## Summary/,/^$/p' licences.md | head -30

      - name: Upload SBOM and licence report
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            **/*.cdx.json
            licences.md

      # Attach both to the release, which is the version of "produced by CI per release"
      # that a buyer can actually reach: an artifact expires, a release asset does not.
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            licences.md
            **/*.cdx.json

      # The security overview is the one piece of this evidence that cannot be generated,
      # so the risk is different: it goes stale silently. Nothing about a document reveals
      # that the thing it describes has changed.
      #
      # This does not try to check that the *content* is true — nothing can. It checks the
      # two claims the document makes about itself: that it is dated, and that it says it
      # claims no certification. A document that loses either has stopped being the thing
      # §2.5 asked for.
      - name: The security overview is dated and claims nothing it should not
        run: |
          set -euo pipefail
          F=docs/security-overview.md

          grep -qE '^\*\*Last reviewed:\*\* [0-9]{4}-[0-9]{2}-[0-9]{2}\.?$' "$F" || {
            echo "::error::$F has no 'Last reviewed: YYYY-MM-DD' line. A security document that is not dated is one nobody can tell is stale."
            exit 1
          }

          grep -q 'No certification' "$F" || {
            echo "::error::$F no longer states that it claims no certification. If a certification has genuinely been obtained, change this guard deliberately."
            exit 1
          }

          # Claiming one is worse than claiming neither — see the document. This catches
          # the sentence drifting into an assertion, which is the way it would happen.
          if grep -inE '(is|are) (ISO ?27001|SOC ?2)[- ]?(certified|compliant|audited)' "$F"; then
            echo "::error::$F asserts a certification. Both are organisational rather than technical; claiming one casually is worse than claiming neither."
            exit 1
          fi

          reviewed="$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<< "$(grep '^\*\*Last reviewed:' "$F")" | head -1)"
          age=$(( ( $(date -u +%s) - $(date -u -d "$reviewed" +%s) ) / 86400 ))
          echo "security overview last reviewed ${reviewed} (${age} days ago)"
          # A warning rather than a failure: a stale document is a thing to fix in a
          # working week, not a thing to block an unrelated pull request on.
          if [ "$age" -gt 180 ]; then
            echo "::warning::$F was last reviewed ${age} days ago. Re-read it against the code and move the date."
          fi
          echo "ok"

  crypto-builds:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard (RustCrypto)
            features: ""
          # NOTE: the FIPS artifact is NOT built here yet.
          #
          # SPEC §M0.4 requires the crypto backend to be a build-time choice, because
          # validation attaches to a binary rather than to a code path. The seam for
          # that exists — `AeadProvider`, the `crypto-awslc` feature, and a CI grep
          # that keeps primitives out of every other crate — but aws-lc-rs is not
          # wired behind it, and the feature currently raises a `compile_error!`
          # saying so.
          #
          # Adding a job here that builds a known-failing target would be theatre.
          # PLAN §0b is explicit: build the seams, pursue no certification until a
          # buyer funds it. Restore this matrix entry in the same commit that
          # implements `AwsLcAead`:
          #
          #   - name: FIPS (aws-lc-rs)
          #     features: "--no-default-features --features crypto-awslc"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace ${{ matrix.features }}

      # Guards the seam itself: the feature must keep failing loudly and for the
      # documented reason, rather than silently falling back to a non-validated
      # backend while a deployment believes it is running FIPS crypto.
      - name: FIPS feature fails closed until implemented
        if: matrix.features == ''
        run: |
          if cargo check -p uops-secrets --no-default-features --features crypto-awslc 2>/dev/null; then
            echo "::error::crypto-awslc compiled without an implementation — it must fail closed"
            exit 1
          fi
          echo "ok: crypto-awslc refuses to build until AwsLcAead exists"

  web:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if package.json and
      # the lockfile disagree, which is the whole reason the lockfile is committed.
      - run: npm ci

      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npx eslint src

      - name: test
        run: npx vitest run

      - name: build
        run: npm run build

      # docs/UI-3D-DEVICE-EXPLORER.md §9: this product has to run air-gapped. The check is
      # against the *built* bundle rather than the source, because the failure is rarely
      # written by hand — a font helper, an icon set, a model loader with a default CDN
      # base. An air-gapped deployment otherwise discovers it as a render that never
      # finishes, which is the worst possible place to find out.
      #
      # After `build`, necessarily: there is nothing to check before it.
      - name: Nothing in the bundle is fetched from the internet
        run: node scripts/no-remote-assets.mjs

      # The session cookie is HttpOnly and cannot be read by script; the CSRF cookie is
      # read by src/api.ts and nothing else. Neither belongs in storage, where it would
      # outlive the session and be readable by anything running on the origin.
      #
      # Comment lines are dropped, as in the Rust hygiene guards: src/api.ts explains at
      # the top why there is no token in localStorage, and a guard that forbids saying so
      # gets the explanation deleted instead of the rule followed.
      # The same mistake has been made three times -- `.num` in M7, `.actions` in M9,
      # and four more found only when this check was written. A class the markup names
      # and the stylesheet does not define fails nothing: no console warning, no build
      # error, and an element that simply inherits the page and looks slightly wrong to
      # somebody who is not looking for it.
      #
      # The checker is a script rather than an inline heredoc so that it can be run
      # locally, by the same command, before a push.
      - name: Every CSS class the markup names exists
        run: node scripts/css-classes.mjs

      - name: No credential or tenant state in browser storage
        run: |
          hits=$(grep -rnE '\b(localStorage|sessionStorage|indexedDB)\b' src/ \
                 | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::browser storage in the web app; the session is a cookie the server sets"
            exit 1
          fi
          echo "ok"

  # SPEC §M1 acceptance: "docker compose up gives a working stack from a clean checkout
  # on a clean machine". A CI runner is literally that, every time, which makes this the
  # only place the claim can be tested rather than asserted.
  #
  # The slowest job here by a wide margin — it is a release build of the workspace plus
  # a production web build. It earns it: everything else in this file tests the code,
  # and this tests whether a person who has just cloned the repository can run it.
  stack:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # BuildKit's cache is what makes a rebuild seconds rather than minutes. Scoped to
      # this job so it cannot be poisoned by another, and capped by GitHub's own cache
      # eviction rather than growing forever.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: uops:dev
          load: true
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=stack,mode=max

      - name: Bring the stack up
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for the server to report healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' uops-server 2>/dev/null || echo starting)
            if [ "$state" = "healthy" ]; then
              echo "healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the server never became healthy"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      # Every entrypoint a compose service names must exist in the image.
      #
      # `uops-collector-syslog` was referenced by a service for two commits while the
      # Dockerfile did not copy it: `docker compose config` validated, the YAML was
      # correct, and the container would have exited instantly with "no such file". The
      # smoke test did not catch it because it only waits for `server`.
      #
      # Read out of the compose file rather than listed here, so a service added next year
      # is checked without anybody remembering to.
      - name: Every compose entrypoint exists in the image
        run: |
          MISSING=0
          ENTRYPOINTS=$(grep -oE '/usr/local/bin/[a-z-]+' deploy/docker-compose.yml | sort -u)
          if [ -z "$ENTRYPOINTS" ]; then
            echo "::error::no entrypoints found in the compose file; this guard is not guarding anything"
            exit 1
          fi
          for BIN in $ENTRYPOINTS; do
            if docker run --rm --entrypoint test uops:dev -x "$BIN"; then
              echo "ok: $BIN"
            else
              echo "::error::$BIN is a compose entrypoint and is not in the image"
              MISSING=1
            fi
          done
          exit $MISSING

      # The other direction, and the one that was missing.
      #
      # The check above verifies that everything the compose file *names* is in the image.
      # It cannot see a binary that is in neither — nothing names it, so nothing asks why.
      # `uops-collector-flow` and `uops-runner` were exactly that: built by
      # `cargo build --workspace --bins`, never copied into the final stage, and named by no
      # service, so a deployment built from this repository's only artefact could not collect
      # a flow or execute a runbook run. The runner is the sharper of the two — the API
      # queues a run and nothing claims it, which reports nothing anywhere.
      #
      # So: every binary the workspace produces must be in the image, or be listed below as
      # deliberately absent with a reason. `docs/packaging.md` §2.
      - name: Every binary the workspace builds is in the image
        run: |
          # Deliberately absent, with the reason. Empty today: everything ships.
          EXCLUDED=""

          MISSING=0
          # Read from the manifests rather than from a list here, so a crate added next year
          # is checked without anybody remembering to.
          BINS=$(for m in crates/*/Cargo.toml; do
                   c=$(dirname "$m")
                   if [ -f "$c/src/main.rs" ]; then basename "$c"; fi
                   for b in "$c"/src/bin/*.rs; do
                     [ -e "$b" ] && basename "$b" .rs
                   done
                 done | sort -u)

          if [ -z "$BINS" ]; then
            echo "::error::found no binaries; this guard is not guarding anything"
            exit 1
          fi

          for BIN in $BINS; do
            case " $EXCLUDED " in
              *" $BIN "*) echo "skipped, deliberately: $BIN"; continue ;;
            esac
            if docker run --rm --entrypoint test uops:dev -x "/usr/local/bin/$BIN"; then
              echo "ok: $BIN"
            else
              echo "::error::$BIN is built by the workspace and is not in the image"
              MISSING=1
            fi
          done
          exit $MISSING

      # Migrations are a separate service that must run to completion. If it did not,
      # `server` would not have started at all — but a green `up` with a silently
      # skipped migration is exactly the failure this criterion is about.
      - name: Migrations ran, and ran to completion
        run: |
          docker compose -f deploy/docker-compose.yml logs migrate
          docker compose -f deploy/docker-compose.yml logs migrate | grep -q "schema is up to date"
          docker compose -f deploy/docker-compose.yml logs migrate | grep -qE "applied [0-9]+ migration"

      - name: The stack answers, and answers as itself
        run: |
          set -e

          # The API, unauthenticated, reporting both stores reachable.
          health=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$health"
          echo "$health" | grep -q '"ok":true'

          # The web app, from the same origin as the API. That is the property the
          # session cookie depends on, and here it is structural rather than configured.
          curl -fsS http://localhost:8080/ | grep -qi "<title>"

          # A client-side route on a hard reload must reach the app, not a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/resources/whatever)" = 200

          # And a mistyped API path must not fall through to it. 200 and a page of HTML
          # is a client parsing failure reported as something other than "no such route".
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/no-such-endpoint)
          test "$code" = 404

      - name: The first-run credential is printed, once, and it works
        run: |
          set -e
          password=$(docker compose -f deploy/docker-compose.yml logs server \
                     | grep -E '^\S+\s+\|\s+password\s+' | awk '{print $NF}')
          test -n "$password"

          # The whole point of the first-run design: the credential on the terminal is
          # one the login handler accepts. A bootstrap that made an account nobody can
          # authenticate as passes every other check in this job.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/jar \
                 -H 'Content-Type: application/json' \
                 -d "{\"email\":\"admin@example.invalid\",\"password\":\"$password\"}" \
                 http://localhost:8080/api/v1/auth/login)
          test "$code" = 204

          curl -fsS -b /tmp/jar http://localhost:8080/api/v1/me | grep -q 'admin@example.invalid'

      - name: A restart re-migrates nothing and prints no second password
        run: |
          set -e
          docker compose -f deploy/docker-compose.yml restart server migrate
          sleep 20
          # Exactly one banner across both boots. A second would mean a second admin,
          # and the operator has no way to tell which password belongs to which account.
          banners=$(docker compose -f deploy/docker-compose.yml logs server | grep -c 'First run' || true)
          test "$banners" = "1"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
