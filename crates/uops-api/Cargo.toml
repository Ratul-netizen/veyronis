[package]
name = "uops-api"
description = "The HTTP surface. The only place TenantScope::from_authenticated is reachable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# A maintenance window's id is a plain uuid rather than a typed newtype: nothing but a
# window ever refers to one, so the class of mistake the newtypes exist to prevent --
# passing a TenantId where a ResourceId belongs -- has no instance here.
uuid.workspace = true
uops-core.workspace = true
uops-notify.workspace = true
uops-identity.workspace = true
uops-query.workspace = true
# M10's routes. The API validates a runbook, plans a run and asks whether one may go — and
# does none of those itself: every rule is in this crate and this one calls it, so the
# screen and `uops-runner` cannot come to different conclusions.
uops-runbook.workspace = true
# The fingerprint over a run's resolved target list — what an approval is *of*. Integrity,
# not secrecy, which is the same reason the migration runner uses it directly rather than
# through uops-secrets.
sha2.workspace = true
uops-oidc.workspace = true
uops-secrets.workspace = true
uops-store-ch.workspace = true
uops-store-pg.workspace = true
# For Range: a discovery job's CIDRs are parsed at the edge, so an operator who typed a
# /8 is told to split it rather than shown the name of a CHECK constraint.
uops-discover.workspace = true
uops-guess.workspace = true

axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
# The integration tests seed organizations, tenants and telemetry directly, because
# those are fixtures rather than anything the API is responsible for creating.
chrono.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tower = { workspace = true, features = ["util"] }
uuid.workspace = true
serde_json.workspace = true
# The SSO integration test signs a real ID token rather than stubbing verification: a
# stub would exercise the plumbing and skip the part that decides whether a forged token
# is accepted, which is the part worth testing.
p256 = { workspace = true, features = ["ecdsa"] }
uops-oidc.workspace = true

[lints]
workspace = true
