[package]
name = "uops-collector-otlp"
description = "The OTLP receiver. OTLP/HTTP over the pipeline the syslog daemon already uses. SPEC M3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
uops-core.workspace = true
uops-otlp.workspace = true
uops-pipeline.workspace = true
uops-identity.workspace = true
uops-store-ch.workspace = true
uops-store-pg.workspace = true

# No TLS feature, deliberately -- the same licence posture as every other transport here.
# An OTLP endpoint on a network terminates TLS at a proxy, which is what the Collector's
# `otlphttp` exporter talks to happily.
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes.workspace = true
chrono.workspace = true
prost.workspace = true
opentelemetry-proto = { workspace = true, default-features = false, features = [
    "gen-tonic-messages", "logs", "metrics", "trace",
] }
serde.workspace = true
# The collector reports what it is bound to as JSON — see `describe_listeners` in main.
serde_json.workspace = true
thiserror.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
sqlx.workspace = true
uuid.workspace = true
# M8 §2.5's correlation is two ordinary queries sharing a predicate, and the tests
# build them with the helpers rather than by hand -- which is the only way to find out
# whether the two decoders agree on what a trace id looks like.
uops-query.workspace = true

[lints]
workspace = true
